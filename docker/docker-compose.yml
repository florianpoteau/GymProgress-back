services:
  gymprogress:
    image: postgres:16.2
    container_name: postgres-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "9224:5432"
    volumes:
      - pg_data:/var/lib/postgres/data
volumes:
  pg_data:
